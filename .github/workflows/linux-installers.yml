name: Linux installers

# 触发：推 v* tag，或手动指定一个已存在的 tag。
# 为什么不挂 release: published：tag push 已经覆盖"打 tag 就发"，两条都挂会让同一次发布
# 跑两遍（第二遍还得靠 --clobber 收尾，纯属自找麻烦）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（必须已存在，例：v0.6.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: linux-installers-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ELECTRON_VER: '33.4.11'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 构建并验证 deb / rpm / AppImage
    # 钉 24.04，不用 ubuntu-latest。2026-11-11 打 v0.10.0 时 latest 已经滚到 26.04（resolute），
    # 新镜像的 apt 源里 security.ubuntu.com 在 runner 上解析不了，`apt-get install` 连续两次
    # 报 "Temporary failure resolving 'security.ubuntu.com'" → exit 100。与代码无关，
    # 但会让发版卡住；LTS 镜像可复现，也和 v0.9.0 产包的环境一致。
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      - name: 读版本号
        run: |
          set -euo pipefail
          VER=$(python3 -c "import json;print(json.load(open('desktop/package.json'))['version'])")
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "版本 $VER / tag $TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: 装打包工具
        run: |
          set -euo pipefail
          # rpm 提供 rpmbuild（步骤「生成 rpm」靠它）；python3-pil 给图标缩放用。
          #
          # 为什么要自己挑镜像：2026-11-11 打 v0.10.0 时，runner 上 apt 一条源都解析不了
          # （先是 security.ubuntu.com，换了 24.04 之后是 azure.archive.ubuntu.com），
          # 但 git / GitHub API 都正常 —— 是这台机器 DNS 对镜像域名不通，不是 GitHub 故障。
          # 所以先探一遍候选镜像，把能通的那个写进 sources，再装包。
          PKGS="rpm python3-pil xz-utils file"
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")

          if sudo apt-get install -y -qq --no-install-recommends $PKGS 2>/dev/null; then
            echo "系统默认源可用，无需换镜像"
            exit 0
          fi
          echo "::warning::默认源装包失败，开始探测镜像"

          MIRRORS="
          http://azure.archive.ubuntu.com/ubuntu
          http://archive.ubuntu.com/ubuntu
          https://mirrors.tuna.tsinghua.edu.cn/ubuntu
          https://mirrors.aliyun.com/ubuntu
          https://mirrors.ustc.edu.cn/ubuntu
          https://mirror.nju.edu.cn/ubuntu
          "
          PICK=""
          for m in $MIRRORS; do
            if curl -fsS -m 8 -o /dev/null "$m/dists/$CODENAME/Release" \
               && curl -fsS -m 8 -o /dev/null "$m/dists/$CODENAME-security/Release"; then
              PICK="$m"
              echo "镜像可用：$PICK"
              break
            fi
            echo "跳过（不可达或没有 $CODENAME-security）：$m"
          done
          if [ -z "$PICK" ]; then
            echo "::error::所有候选镜像都不可达，runner 的 DNS 有问题"
            cat /etc/resolv.conf || true
            getent hosts archive.ubuntu.com || true
            exit 1
          fi

          sudo mkdir -p /etc/apt/sources.list.d
          sudo rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          sudo tee /etc/apt/sources.list >/dev/null <<EOF
          deb $PICK $CODENAME main restricted universe multiverse
          deb $PICK $CODENAME-updates main restricted universe multiverse
          deb $PICK $CODENAME-security main restricted universe multiverse
          EOF

          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for try in 1 2 3; do
            sudo apt-get $APT_OPTS update -qq || echo "::warning::第 $try 次 update 未完全成功"
            if sudo apt-get $APT_OPTS install -y -qq --no-install-recommends $PKGS; then
              echo "装包成功（第 $try 次尝试，镜像 $PICK）"
              exit 0
            fi
            echo "::warning::第 $try 次装包失败"
            sleep 10
          done
          echo "::error::打包工具安装失败（已换镜像并重试 3 次）"
          exit 1

      - name: 构建前端
        run: |
          set -euo pipefail
          cd core
          npm ci --no-audit --no-fund
          npm run build

      - name: 下载 Electron 预编译包
        run: |
          set -euo pipefail
          mkdir -p build
          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VER}/electron-v${ELECTRON_VER}-linux-x64.zip"
          curl -fsSL --retry 3 -o build/electron.zip "$URL"
          ls -l build/electron.zip
          echo "sha256 $(sha256sum build/electron.zip | cut -d' ' -f1)"

      - name: 生成 FHS 暂存树
        run: |
          set -euo pipefail
          python3 tools/linux-stage.py --zip build/electron.zip --stage build/stage --deb
          mkdir -p release

      - name: 生成 tar.gz（免安装版）
        run: |
          set -euo pipefail
          python3 tools/pack-linux.py --zip build/electron.zip
          ls -l release/*.tar.gz

      - name: 生成 deb
        run: |
          set -euo pipefail
          # --root-owner-group：归档里强制 uid/gid = 0。
          # 不加的话文件属主会是 runner 的 uid 1001，装上就是 1001 的文件。
          dpkg-deb --build --root-owner-group build/stage "release/lypora_${VER}_amd64.deb"
          ls -l release/*.deb

      - name: 生成 rpm
        run: |
          set -euo pipefail
          # 属主不用管：rpm 对 %files 里的文件默认按 root:root 记录（%defattr 缺省值）。
          # setuid 位才是坑——它是在 spec 的 %install 里被 cp 抹掉的，所以由 spec 自己 chmod 补。
          # 这里只把结果打出来，方便日志里对齐"包内 mode"与"落盘 mode"。
          stat -c '%U:%G %a %n' build/stage/opt/lypora/chrome-sandbox
          mkdir -p build/rpm/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb \
            --define "_version ${VER}" \
            --define "_stage_root $PWD/build/stage" \
            --define "_topdir $PWD/build/rpm" \
            packaging/lypora.spec
          cp build/rpm/RPMS/x86_64/*.rpm release/
          ls -l release/*.rpm

      - name: 生成 AppImage
        run: |
          set -euo pipefail
          python3 tools/linux-stage.py --stage build/stage --appdir build/AppDir
          curl -fsSL --retry 3 -o build/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x build/appimagetool
          # --appimage-extract-and-run：runner 上没有 FUSE，不能直接挂载运行
          ARCH=x86_64 ./build/appimagetool --appimage-extract-and-run --no-appstream \
            build/AppDir "release/Lypora-${VER}-linux-x64.AppImage"
          ls -l release/*.AppImage

      - name: 结构检查（原生工具）
        run: |
          set -euo pipefail
          echo "== dpkg-deb -I =="
          dpkg-deb -I release/lypora_*.deb
          echo
          echo "== dpkg-deb -c（前 25 条）=="
          dpkg-deb -c release/lypora_*.deb | sed -n '1,25p'
          echo
          echo "== 关键文件权限 =="
          dpkg-deb -c release/lypora_*.deb | grep -E 'chrome-sandbox|/usr/bin/lypora|lypora\.desktop'
          echo
          echo "== rpm -qip =="
          rpm -qip release/lypora-*.rpm
          echo
          echo "== rpm -qplv | 关键路径（含权限位）=="
          rpm -qplv release/lypora-*.rpm | grep -E 'chrome-sandbox|/usr/bin/lypora|lypora\.desktop'
          echo
          echo "== AppImage 头 =="
          file release/*.AppImage

      - name: 安装测试（Debian 12 容器）
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/release:/pkg:ro" debian:12 bash -ec '
            apt-get update -qq
            apt-get install -y -qq /pkg/lypora_*.deb
            echo "--- 已安装 ---"
            dpkg -s lypora | head -6
            echo "--- 关键文件 ---"
            stat -c "%U:%G %A %n" /opt/lypora/chrome-sandbox /usr/bin/lypora
            test -x /usr/bin/lypora
            test -u /opt/lypora/chrome-sandbox
            echo "ok: 命令行入口可执行、沙箱助手带 setuid"
            echo "--- 文件数 ---"
            dpkg -L lypora | wc -l
          '

      - name: 安装测试（Fedora 40 容器）
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/release:/pkg:ro" fedora:40 bash -ec '
            dnf install -y -q /pkg/lypora-*.rpm
            echo "--- 已安装 ---"
            rpm -q lypora
            echo "--- 落盘权限 ---"
            stat -c "%U:%G %A %n" /opt/lypora/chrome-sandbox /usr/bin/lypora
            echo "--- 断言 ---"
            [ -x /usr/bin/lypora ] || { echo "!! /usr/bin/lypora 不可执行"; exit 1; }
            [ -u /opt/lypora/chrome-sandbox ] || { echo "!! chrome-sandbox 丢了 setuid 位"; exit 1; }
            echo "ok: 命令行入口可执行、沙箱助手带 setuid"
            echo "--- 文件数 ---"
            rpm -ql lypora | wc -l
          '

      - name: 生成校验并上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release
          sha256sum lypora_*.deb lypora-*.rpm *.AppImage Lypora-*-linux-x64.tar.gz > /tmp/new-sums.txt
          cat /tmp/new-sums.txt

          # Release 已经存在（本地 publish-release.mjs 先建过）就沿用，否则新建
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Lypora $TAG" --generate-notes
          fi

          # 合并校验清单：保留 release 上已有的其他平台条目，被本次产物覆盖的旧行丢弃
          mkdir -p ../build/old
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir ../build/old || true
          : > /tmp/merged.txt
          if [ -f ../build/old/SHA256SUMS.txt ]; then
            grep -vE '(lypora_.*\.deb|lypora-[0-9.]+-[0-9]+.*\.rpm|\.AppImage|Lypora-.*-linux-x64\.tar\.gz)$' \
              ../build/old/SHA256SUMS.txt >> /tmp/merged.txt || true
          fi
          cat /tmp/new-sums.txt >> /tmp/merged.txt
          sort -k2 /tmp/merged.txt -o SHA256SUMS.txt
          echo "--- 合并后的 SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

          gh release upload "$TAG" --clobber \
            lypora_*.deb lypora-*.rpm *.AppImage Lypora-*-linux-x64.tar.gz SHA256SUMS.txt

      - name: 汇总
        run: |
          echo "## Linux 安装包" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh release/ | sed -n '1,20p' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      # 放在最后：它是唯一能在 Linux 上真正启动一次的机会，但容器里没有 GPU / D-Bus /
      # 真实桌面会话，Electron 可能起得来也可能卡住。所以
      #   ① 必须在产物已经上传之后跑，卡住也不耽误发布；
      #   ② 必须硬超时（timeout 90 + timeout-minutes），否则会把整个 job 拖到 45 分钟上限。
      - name: 运行时冒烟（xvfb，尽力而为）
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -uo pipefail
          docker run --rm -v "$PWD/release:/pkg:ro" debian:12 bash -ec '
            apt-get update -qq
            apt-get install -y -qq /pkg/lypora_*.deb xvfb libnss3 libgbm1
            set +e
            timeout 90 xvfb-run -a /opt/lypora/lypora --no-sandbox --selftest
            echo "selftest exit=$?"
            exit 0
          '
